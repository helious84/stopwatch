<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="themeColor" content="#f5f5f4">
<meta name="description" content="선수가 트랙을 달리며 시간을 보여주는 스탑워치. 랩마다 선수가 늘어나 기록을 한눈에 비교할 수 있어요.">
<title>달리는 스탑워치</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1 data-i18n="appTitle">달리는 스탑워치</h1>
    <button class="icon-btn" id="shareBtn" data-i18n-aria="share" aria-label="공유" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
    </button>
    <button class="icon-btn" id="historyBtn" data-i18n-aria="history" aria-label="기록">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 7v5l3 2"/></svg>
    </button>
    <button class="icon-btn" id="settingsBtn" data-i18n-aria="settings" aria-label="설정">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <section class="stage">
    <svg id="track" viewBox="0 -30 600 370" role="img" aria-labelledby="trackDesc">
      <title id="trackDesc" data-i18n="trackDesc"></title>
      <defs>
        <pattern id="grass" width="40" height="340" patternUnits="userSpaceOnUse">
          <rect width="20" height="340" fill="#3f8f4f"/>
          <rect x="20" width="20" height="340" fill="#45985a"/>
        </pattern>
      </defs>
      <rect x="0" y="-30" width="600" height="370" rx="16" fill="#2f6e3d"/>
      <path fill="none" stroke="#c8553d" stroke-width="56"
            d="M300,40 H430 A130,130 0 0 1 430,300 H170 A130,130 0 0 1 170,40 Z"/>
      <g fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.5">
        <path d="M300,12 H430 A158,158 0 0 1 430,328 H170 A158,158 0 0 1 170,12 Z"/>
        <path d="M300,26 H430 A144,144 0 0 1 430,314 H170 A144,144 0 0 1 170,26 Z"/>
        <path d="M300,54 H430 A116,116 0 0 1 430,286 H170 A116,116 0 0 1 170,54 Z"/>
        <path d="M300,68 H430 A102,102 0 0 1 430,272 H170 A102,102 0 0 1 170,68 Z"/>
      </g>
      <path fill="url(#grass)" d="M300,68 H430 A102,102 0 0 1 430,272 H170 A102,102 0 0 1 170,68 Z"/>
      <path id="progress" fill="none" stroke="#fde047" stroke-width="4" stroke-linecap="round" opacity=".9"
            d="M300,40 H430 A130,130 0 0 1 430,300 H170 A130,130 0 0 1 170,40 Z"/>
      <path id="lane" fill="none" stroke="none"
            d="M300,40 H430 A130,130 0 0 1 430,300 H170 A130,130 0 0 1 170,40 Z"/>
      <rect x="297" y="12" width="6" height="56" fill="#fff"/>
      <g id="ticks" aria-hidden="true"></g>
      <g aria-hidden="true">
        <text class="laps-count" id="lapsCount" x="300" y="126"></text>
        <text class="clock" x="300" y="188"><tspan id="clockMain">00:00</tspan><tspan id="clockCs" class="ms">.00</tspan></text>
        <text class="legend" id="legend1" x="300" y="220"></text>
        <text class="legend" id="legend2" x="300" y="236"></text>
      </g>
      <g id="standing" aria-hidden="true"></g>
      <g id="movers" aria-hidden="true"></g>
    </svg>
  </section>

  <ul class="laps" id="laps" data-i18n-aria="lapsLabel" aria-label="랩 기록"></ul>

  <footer class="controls">
    <div class="btns">
      <button id="leftBtn" class="btn secondary" disabled>랩</button>
      <button id="mainBtn" class="btn primary">출발</button>
    </div>
    <p class="keys-hint" data-i18n="keysHint"></p>
  </footer>
</div>

<div id="toast" class="toast" role="status" hidden>
  <span id="toastMsg"></span>
  <button id="toastAction" class="toast-action" hidden></button>
</div>
<div id="announcer" class="sr-only" aria-live="polite"></div>

<dialog id="settingsDlg" aria-labelledby="settingsTitle">
  <form method="dialog" class="sheet">
    <div class="sheet-head">
      <h2 id="settingsTitle" data-i18n="settings">설정</h2>
      <button class="icon-btn" value="close" data-i18n-aria="close" aria-label="닫기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <label class="row">
      <span data-i18n="lapLen"></span>
      <select id="setLapLen">
        <option value="30000"></option>
        <option value="60000"></option>
        <option value="120000"></option>
        <option value="300000"></option>
      </select>
    </label>
    <label class="row">
      <span data-i18n="theme"></span>
      <select id="setTheme">
        <option value="system" data-i18n="themeSystem"></option>
        <option value="light" data-i18n="themeLight"></option>
        <option value="dark" data-i18n="themeDark"></option>
      </select>
    </label>
    <label class="row">
      <span data-i18n="language"></span>
      <select id="setLang">
        <option value="auto" data-i18n="langAuto"></option>
        <option value="ko">한국어</option>
        <option value="en">English</option>
      </select>
    </label>
    <label class="row switch">
      <span><span data-i18n="sound"></span><small data-i18n="soundDesc"></small></span>
      <input type="checkbox" id="setSound" role="switch">
    </label>
    <label class="row switch">
      <span><span data-i18n="vibrate"></span><small data-i18n="vibrateDesc"></small></span>
      <input type="checkbox" id="setVibrate" role="switch">
    </label>
    <label class="row switch">
      <span><span data-i18n="keepAwake"></span><small data-i18n="keepAwakeDesc"></small></span>
      <input type="checkbox" id="setKeepAwake" role="switch">
    </label>
    <p class="about" id="aboutText"></p>
  </form>
</dialog>

<dialog id="historyDlg" aria-labelledby="historyTitle">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="historyTitle" data-i18n="history">기록</h2>
      <button class="icon-btn" data-close data-i18n-aria="close" aria-label="닫기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div id="historyList" class="history-list"></div>
    <button id="clearHistory" class="text-btn danger" data-i18n="clearAll"></button>
  </div>
</dialog>

<dialog id="onboardDlg" aria-labelledby="onboardTitle">
  <div class="sheet onboard">
    <h2 id="onboardTitle" data-i18n="onboardTitle"></h2>
    <ol>
      <li><span class="ob-dot" style="background:#facc15"></span><span data-i18n="onboard1"></span></li>
      <li><span class="ob-dot" style="background:#f5f5f4"></span><span data-i18n="onboard2"></span></li>
      <li><span class="ob-dot" style="background:#22c55e"></span><span data-i18n="onboard3"></span></li>
    </ol>
    <button class="btn primary" data-close data-i18n="gotIt"></button>
  </div>
</dialog>

<script src="js/core.js"></script>
<script src="js/i18n.js"></script>
<script src="js/track.js"></script>
<script src="js/app.js"></script>
</body>
</html>
